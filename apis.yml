    type: Documentation
  - url: https://developer.2c2p.com/reference/post_payment-4-3-payment
    type: APIReference
  - url: openapi/2c2p-openapi.yml
    type: OpenAPI
  - url: collections/2c2p.postman_collection.json
    type: PostmanCollection
  - url: collections/2c2p.opencollection.json
    type: OpenCollection
  description: Executes a payment against a paymentToken, selecting the channel
    (card, e-wallet, QR, installment, pay-later, loyalty) via the payment code and
    supplying card, customer, browser, and return-URL data. Supports the direct /
    Secure Fields integration where card data is tokenized client-side.
- aid: 2c2p:2c2p-payment-option-api
