apis:
- aid: 2c2p:2c2p-payment-token-api
  name: 2C2P Payment Token API
  tags:
  - Payment Token
  - Checkout
  - Cards
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.2c2p.com/docs/api-payment-token
  baseURL: https://pgw.2c2p.com/payment/4.3
  properties:
  - url: https://developer.2c2p.com/docs/api-payment-token
    type: Documentation
  - url: https://developer.2c2p.com/reference/post_payment-4-3-paymenttoken
    type: APIReference
  - url: openapi/2c2p-openapi.yml
    type: OpenAPI
  - url: collections/2c2p.postman_collection.json
    type: PostmanCollection
  - url: collections/2c2p.opencollection.json
    type: OpenCollection
  description: Server-to-server POST that initializes a payment and returns a
    paymentToken plus a webPaymentUrl for the hosted payment page. Request and
    response bodies are JWTs signed with the merchant secret key (HMAC SHA-256).
    Carries invoiceNo, amount, currencyCode, description, and channel/tokenize
    options.
- aid: 2c2p:2c2p-do-payment-api
  name: 2C2P Do Payment API
  tags:
  - Payments
  - Cards
  - E-Wallet
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.2c2p.com/docs/sdk-api-do-payment
  baseURL: https://pgw.2c2p.com/payment/4.3
  properties:
