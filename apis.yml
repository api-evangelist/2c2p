  - Currency
  - DCC
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.2c2p.com/reference/post_payment-4-3-exchangerate
  baseURL: https://pgw.2c2p.com/payment/4.3
  properties:
  - url: https://developer.2c2p.com/reference/post_payment-4-3-exchangerate
    type: APIReference
  - url: openapi/2c2p-openapi.yml
    type: OpenAPI
  - url: collections/2c2p.postman_collection.json
    type: PostmanCollection
  - url: collections/2c2p.opencollection.json
    type: OpenCollection
  description: Retrieves currency exchange rates for a transaction, supporting
    dynamic currency conversion (DCC) and alternative-payment-method MCC exchange
    rates. JWT request and response, with a JWT+JWS secured variant available.
- aid: 2c2p:2c2p-secure-fields-api
  name: 2C2P Secure Fields
  tags:
  - Secure Fields
  - PCI
  - Client Side
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.2c2p.com/docs/using-securefields
  baseURL: https://pgw.2c2p.com
  properties:
  - url: https://developer.2c2p.com/docs/using-securefields
    type: Documentation
  - url: https://developer.2c2p.com/docs/sdk-download-securepay
    type: SDK
  description: Browser-side card capture that loads 2C2P-hosted input elements into
    the merchant's own checkout page, returning an encryptedCardInfo /
    securePayToken that is passed to the Do Payment (or SecurePay) API so raw PAN
    never touches the merchant server. Reduces merchant PCI scope.
