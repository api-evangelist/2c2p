aid: "2c2p"
url: https://raw.githubusercontent.com/api-evangelist/2c2p/refs/heads/main/apis.yml
name: "2C2P"
kind: company
description: 2C2P is a Singapore-headquartered payments platform serving merchants
  across Southeast Asia and beyond. Its Payment Gateway (PGW) API - currently Payment
  v4.3 - lets merchants accept cards, e-wallets, QR, installments, and alternative
  payment methods via a server-to-server REST interface where every request and
  response body is a JWT (JWS) signed with the merchant's secret key. The platform
  covers hosted-page and Secure Fields (direct) card capture, tokenization and
  recurring payments, transaction inquiry and status, void/cancel and refund
  maintenance, currency exchange, and backend (server-to-server) payment
  notifications. 2C2P is part of Ant International.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Gateway
- Southeast Asia
- Singapore
- Thailand
- Cards
- E-Wallet
- Payment Token
- Cross-Border
- Fintech
