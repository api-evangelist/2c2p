meters:
- name: transaction_value
  description: Merchant discount rate (MDR) applied as a percentage of each processed transaction's value. Rate varies by payment method, scheme, and market.
  unit: percent_of_amount
  aggregation: sum
  dimensions:
  - merchant
  - paymentMethod
  - currency
  - country
- name: per_transaction_fee
  description: Fixed fee charged per successful transaction, on top of or instead of the percentage MDR, depending on method and agreement.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - paymentMethod
  - currency
- name: cross_border_fx
  description: Cross-border and FX / dynamic currency conversion margin on multi-currency and international transactions.
  unit: percent_of_amount
  aggregation: sum
  dimensions:
  - merchant
  - currency
  - country
- name: refund_chargeback
  description: Handling fees for refunds and chargebacks / disputes, where applicable per the merchant agreement.
  unit: events
  aggregation: sum
  dimensions:
  - merchant
  - type
- name: payout_disbursement
  description: Fees for payout / disbursement of funds to beneficiaries via 2C2P Payout services, where used.
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - currency
principles:
- name: Visibility
  description: Reconcile settlement reports (batch reconciliation services) against transaction volume per payment method, currency, and country to see effective blended cost per transaction.
- name: Allocation
  description: Tag transactions by invoiceNo / channel / brand so payment cost maps to product lines and internal cost centers.
- name: Optimization
  description: Route to lower-cost payment methods where possible (local e-wallets / QR vs. cross-border cards), minimize FX/DCC margin, and reduce refunds/chargebacks that carry handling fees.
- name: Accountability
  description: Assign an owner for the 2C2P merchant relationship; review the negotiated rate card and monthly settlement statements against budget.
