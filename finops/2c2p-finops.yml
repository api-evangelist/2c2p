description: >-
  FinOps view of 2C2P spend. 2C2P is a merchant acquirer / payment gateway, so
  cost is not a per-API-call software fee but a per-transaction payment cost:
  typically a merchant discount rate (a percentage of transaction value) and/or
  a fixed per-transaction fee, which vary by payment method (card scheme,
  e-wallet, QR, installment, cross-border), currency, country, settlement
  terms, and the negotiated merchant agreement. Additional costs can include
  cross-border / FX and dynamic currency conversion margins, refund/chargeback
  handling, and payout/disbursement fees. There is no public self-serve rate
  card; pricing is set during commercial onboarding.
notes: >-
  Per-transaction rates are NOT reconciled here - 2C2P does not publish a fixed
  public price list, and effective rates are negotiated per merchant and per
  market. The sandbox (sandbox-pgw.2c2p.com) is free for development and
  testing. Treat the meters below as the cost dimensions to instrument, not as
  quoted prices; confirm actual rates in your 2C2P merchant agreement.
